name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: ./

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Build Android App with Capacitor
      run: |
        npx cap sync

    - name: Inject Unified Kotlin Version Fix
      run: |
        # This injects Option 1 directly into the global root configuration
        cat << 'EOF' >> android/build.gradle

        allprojects {
            configurations.all {
                resolutionStrategy {
                    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                }
            }
        }
        EOF

    - name: Unblock Gradle Permissions & Update Wrapper
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.9

    - name: Build Gradle APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BudgWise-APK
        path: android/app/build/outputs/apk/debug/*.apk
