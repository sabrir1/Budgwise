name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: ./

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Build Android App with Capacitor
      run: |
        npx cap sync

    - name: Force Update Gradle Wrapper
      run: |
        cd android
        # This upgrades the runner's build environment to be perfectly compatible with Java 17
        ./gradlew wrapper --gradle-version 8.4

    - name: Build Gradle APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BudgWise-APK
        path: android/app/build/outputs/apk/debug/*.apk
